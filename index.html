// ─── SHUFFLE UTILITY ─────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── CONFETTI ────────────────────────────────────────────────────────────────
function Confetti({ show }) {
  if (!show) return null;
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 9999 }}>
      {Array.from({ length: 40 }).map((_, i) => {
        const left = Math.random() * 100;
        const delay = Math.random() * 0.5;
        const dur = 1.5 + Math.random();
        const size = 6 + Math.random() * 8;
        const colors = ["#009CDC", "#F5822A", "#00B140", "#FFD400", "#E03C31", "#6B3FA0"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        return (
          <div key={i} style={{
            position: "absolute", top: -20, left: `${left}%`, width: size, height: size,
            backgroundColor: color, borderRadius: Math.random() > 0.5 ? "50%" : "2px",
            animation: `confettiFall ${dur}s ease-out ${delay}s forwards`,
            transform: `rotate(${Math.random() * 360}deg)`,
            opacity: 0.9
          }} />
        );
      })}
      <style>{`
        @keyframes confettiFall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
      `}</style>
    </div>
  );
}

// ─── FLASHCARD MODULE ────────────────────────────────────────────────────────
function Flashcards({ vocab, unitColor }) {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [cards, setCards] = useState(() => shuffle(vocab));
  const [known, setKnown] = useState(0);

  const reset = () => { setCards(shuffle(vocab)); setIdx(0); setFlipped(false); setKnown(0); };
  const card = cards[idx];
  const progress = ((idx) / cards.length) * 100;

  return (
    <div style={{ maxWidth: 560, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, color: "#666", fontWeight: 500 }}>
          Card {idx + 1} of {cards.length} · {known} known
        </span>
        <button onClick={reset} style={{ ...pillBtn, background: "transparent", color: unitColor, border: `1.5px solid ${unitColor}`, fontSize: 12, padding: "4px 14px" }}>
          Shuffle & Restart
        </button>
      </div>

      <div style={{ height: 4, background: "#e8e8e8", borderRadius: 2, marginBottom: 24, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${progress}%`, background: unitColor, borderRadius: 2, transition: "width 0.4s ease" }} />
      </div>

      {idx < cards.length ? (
        <>
          <div onClick={() => setFlipped(!flipped)} style={{
            perspective: 1000, cursor: "pointer", height: 280, marginBottom: 20
          }}>
            <div style={{
              position: "relative", width: "100%", height: "100%",
              transition: "transform 0.5s", transformStyle: "preserve-3d",
              transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)"
            }}>
              {/* FRONT */}
              <div style={{
                ...cardFace, backfaceVisibility: "hidden",
                background: `linear-gradient(135deg, ${unitColor}11, ${unitColor}06)`,
                border: `2px solid ${unitColor}30`
              }}>
                <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: unitColor, fontWeight: 700, fontFamily: "Poppins, sans-serif", marginBottom: 12 }}>Term</span>
                <span style={{ fontSize: 26, fontWeight: 700, color: "#1a1a2e", fontFamily: "Poppins, sans-serif", textAlign: "center", lineHeight: 1.3 }}>{card.term}</span>
                <span style={{ fontSize: 12, color: "#999", fontFamily: "Poppins, sans-serif", marginTop: 16 }}>tap to flip</span>
              </div>
              {/* BACK */}
              <div style={{
                ...cardFace, backfaceVisibility: "hidden",
                transform: "rotateY(180deg)", background: "#fff",
                border: `2px solid ${unitColor}30`
              }}>
                <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: unitColor, fontWeight: 700, fontFamily: "Poppins, sans-serif", marginBottom: 8 }}>Definition</span>
                <span style={{ fontSize: 15, color: "#333", fontFamily: "Poppins, sans-serif", textAlign: "center", lineHeight: 1.6, padding: "0 8px" }}>{card.definition}</span>
              </div>
            </div>
          </div>

          <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
            <button onClick={() => { setFlipped(false); setIdx(idx + 1); }} style={{ ...pillBtn, background: "#E03C31", color: "#fff", flex: 1, maxWidth: 180 }}>
              ✗ Still Learning
            </button>
            <button onClick={() => { setFlipped(false); setKnown(known + 1); setIdx(idx + 1); }} style={{ ...pillBtn, background: "#00B140", color: "#fff", flex: 1, maxWidth: 180 }}>
              ✓ Got It
            </button>
          </div>
        </>
      ) : (
        <div style={{ textAlign: "center", padding: 40 }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>🎉</div>
          <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 22, fontWeight: 700, color: "#1a1a2e" }}>Deck Complete!</p>
          <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 16, color: "#666", margin: "8px 0 24px" }}>
            You knew <strong style={{ color: "#00B140" }}>{known}</strong> out of <strong>{cards.length}</strong> terms
          </p>
          <button onClick={reset} style={{ ...pillBtn, background: unitColor, color: "#fff", padding: "10px 32px" }}>Study Again</button>
        </div>
      )}
    </div>
  );
}

// ─── MATCHING MODULE ─────────────────────────────────────────────────────────
function Matching({ vocab, unitColor }) {
  const ROUND_SIZE = 6;
  const [round, setRound] = useState(() => shuffle(vocab).slice(0, ROUND_SIZE));
  const [selected, setSelected] = useState(null);
  const [matched, setMatched] = useState([]);
  const [wrong, setWrong] = useState(null);
  const [showConfetti, setShowConfetti] = useState(false);

  const terms = round.map(v => ({ type: "term", text: v.term, id: v.term }));
  const defs = shuffle(round.map(v => ({ type: "def", text: v.definition.length > 90 ? v.definition.slice(0, 87) + "…" : v.definition, id: v.term, full: v.definition })));

  const handleClick = (item) => {
    if (matched.includes(item.id) && selected?.id !== item.id) return;
    if (matched.includes(item.id)) return;

    if (!selected) {
      setSelected(item);
    } else if (selected.type === item.type) {
      setSelected(item);
    } else {
      if (selected.id === item.id) {
        setMatched(prev => {
          const next = [...prev, item.id];
          if (next.length === ROUND_SIZE) {
            setShowConfetti(true);
            setTimeout(() => setShowConfetti(false), 2000);
          }
          return next;
        });
        setSelected(null);
      } else {
        setWrong(item);
        setTimeout(() => { setWrong(null); setSelected(null); }, 600);
      }
    }
  };

  const newRound = () => {
    setRound(shuffle(vocab).slice(0, ROUND_SIZE));
    setSelected(null); setMatched([]); setWrong(null);
  };

  const isActive = (item) => selected?.type === item.type && selected?.text === item.text;
  const isMatched = (item) => matched.includes(item.id);
  const isWrong = (item) => wrong?.text === item.text;

  return (
    <div style={{ maxWidth: 700, margin: "0 auto" }}>
      <Confetti show={showConfetti} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, color: "#666", fontWeight: 500 }}>
          Matched: {matched.length}/{ROUND_SIZE}
        </span>
        <button onClick={newRound} style={{ ...pillBtn, background: "transparent", color: unitColor, border: `1.5px solid ${unitColor}`, fontSize: 12, padding: "4px 14px" }}>
          New Round
        </button>
      </div>

      {matched.length === ROUND_SIZE ? (
        <div style={{ textAlign: "center", padding: 40 }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>🏆</div>
          <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 22, fontWeight: 700, color: "#1a1a2e" }}>All Matched!</p>
          <button onClick={newRound} style={{ ...pillBtn, background: unitColor, color: "#fff", padding: "10px 32px", marginTop: 16 }}>Play Again</button>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: unitColor, fontWeight: 700, fontFamily: "Poppins, sans-serif", marginBottom: 4, textAlign: "center" }}>Terms</div>
            {terms.map(t => (
              <button key={t.text} onClick={() => handleClick(t)} disabled={isMatched(t)} style={{
                ...matchCard,
                borderColor: isMatched(t) ? "#00B140" : isActive(t) ? unitColor : isWrong(t) ? "#E03C31" : "#ddd",
                background: isMatched(t) ? "#00B14010" : isActive(t) ? `${unitColor}12` : isWrong(t) ? "#E03C3112" : "#fff",
                opacity: isMatched(t) ? 0.5 : 1,
                color: "#1a1a2e", fontWeight: 600, fontSize: 14
              }}>
                {t.text}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: unitColor, fontWeight: 700, fontFamily: "Poppins, sans-serif", marginBottom: 4, textAlign: "center" }}>Definitions</div>
            {defs.map(d => (
              <button key={d.text} onClick={() => handleClick(d)} disabled={isMatched(d)} style={{
                ...matchCard,
                borderColor: isMatched(d) ? "#00B140" : isActive(d) ? unitColor : isWrong(d) ? "#E03C31" : "#ddd",
                background: isMatched(d) ? "#00B14010" : isActive(d) ? `${unitColor}12` : isWrong(d) ? "#E03C3112" : "#fff",
                opacity: isMatched(d) ? 0.5 : 1,
                fontSize: 12, lineHeight: 1.4
              }}>
                {d.text}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── MULTIPLE CHOICE MODULE ──────────────────────────────────────────────────
function MultipleChoice({ vocab, unitColor }) {
  const allVocab = vocab;
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [showConfetti, setShowConfetti] = useState(false);

  const generate = useCallback(() => {
    const shuffled = shuffle(allVocab);
    const qs = shuffled.slice(0, Math.min(10, shuffled.length)).map(v => {
      const wrong = shuffle(allVocab.filter(x => x.term !== v.term)).slice(0, 3);
      const options = shuffle([
        { text: v.definition, correct: true },
        ...wrong.map(w => ({ text: w.definition, correct: false }))
      ]);
      return { term: v.term, options };
    });
    setQuestions(qs); setQIdx(0); setSelected(null); setScore(0);
  }, [allVocab]);

  useEffect(() => { generate(); }, [generate]);

  const handleSelect = (opt, i) => {
    if (selected !== null) return;
    setSelected(i);
    if (opt.correct) {
      setScore(s => s + 1);
      if (qIdx === questions.length - 1 && score + 1 === questions.length) {
        setShowConfetti(true);
        setTimeout(() => setShowConfetti(false), 2500);
      }
    }
  };

  const next = () => { setQIdx(qIdx + 1); setSelected(null); };
  const q = questions[qIdx];
  if (!q) return null;

  return (
    <div style={{ maxWidth: 600, margin: "0 auto" }}>
      <Confetti show={showConfetti} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, color: "#666", fontWeight: 500 }}>
          Question {qIdx + 1}/{questions.length} · Score: {score}
        </span>
        <button onClick={generate} style={{ ...pillBtn, background: "transparent", color: unitColor, border: `1.5px solid ${unitColor}`, fontSize: 12, padding: "4px 14px" }}>
          New Quiz
        </button>
      </div>

      <div style={{ height: 4, background: "#e8e8e8", borderRadius: 2, marginBottom: 24, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${((qIdx) / questions.length) * 100}%`, background: unitColor, borderRadius: 2, transition: "width 0.4s" }} />
      </div>

      {qIdx < questions.length ? (
        <>
          <div style={{ background: `linear-gradient(135deg, ${unitColor}10, ${unitColor}05)`, border: `2px solid ${unitColor}25`, borderRadius: 16, padding: "24px 20px", marginBottom: 20, textAlign: "center" }}>
            <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: unitColor, fontWeight: 700, fontFamily: "Poppins, sans-serif" }}>What is the definition of...</span>
            <p style={{ fontSize: 22, fontWeight: 700, color: "#1a1a2e", fontFamily: "Poppins, sans-serif", margin: "12px 0 0" }}>{q.term}</p>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
            {q.options.map((opt, i) => {
              let bg = "#fff", border = "#ddd", txtColor = "#333";
              if (selected !== null) {
                if (opt.correct) { bg = "#00B14015"; border = "#00B140"; txtColor = "#00B140"; }
                else if (i === selected && !opt.correct) { bg = "#E03C3115"; border = "#E03C31"; txtColor = "#E03C31"; }
              } else if (i === selected) { bg = `${unitColor}10`; border = unitColor; }
              return (
                <button key={i} onClick={() => handleSelect(opt, i)} style={{
                  ...matchCard, borderColor: border, background: bg, color: txtColor,
                  textAlign: "left", fontSize: 16, lineHeight: 1.5, padding: "14px 16px",
                  cursor: selected !== null ? "default" : "pointer"
                }}>
                  <span style={{ fontWeight: 700, marginRight: 10, color: border !== "#ddd" ? border : unitColor }}>
                    {String.fromCharCode(65 + i)}.
                  </span>
                  {opt.text}
                </button>
              );
            })}
          </div>

          {selected !== null && qIdx < questions.length - 1 && (
            <div style={{ textAlign: "center" }}>
              <button onClick={next} style={{ ...pillBtn, background: unitColor, color: "#fff", padding: "10px 36px" }}>Next →</button>
            </div>
          )}

          {selected !== null && qIdx === questions.length - 1 && (
            <div style={{ textAlign: "center", padding: 24 }}>
              <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 20, fontWeight: 700, color: "#1a1a2e" }}>
                Final Score: {score + (q.options[selected]?.correct ? 0 : 0)}/{questions.length}
              </p>
              <button onClick={generate} style={{ ...pillBtn, background: unitColor, color: "#fff", padding: "10px 32px", marginTop: 12 }}>Try Again</button>
            </div>
          )}
        </>
      ) : null}
    </div>
  );
}

// ─── MASTER QUIZ MODULE ──────────────────────────────────────────────────────
function MasterQuiz({ vocab }) {
  const maxQuestions = Math.floor(vocab.length / 5) * 5;
  const questionOptions = Array.from({ length: Math.max(1, maxQuestions / 5) }, (_, i) => (i + 1) * 5);
  const [questionCount, setQuestionCount] = useState(Math.min(10, maxQuestions));
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [started, setStarted] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);

  const generateQuiz = () => {
    const chosen = shuffle(vocab).slice(0, questionCount);
    const qs = chosen.map(v => {
      const wrong = shuffle(vocab.filter(x => x.term !== v.term)).slice(0, 3);
      const options = shuffle([
        { text: v.definition, correct: true },
        ...wrong.map(w => ({ text: w.definition, correct: false }))
      ]);
      return { term: v.term, unitTitle: v.unitTitle, unitId: v.unitId, unitColor: v.unitColor, options };
    });
    setQuestions(qs);
    setQIdx(0);
    setSelected(null);
    setScore(0);
    setStarted(true);
    setShowConfetti(false);
  };

  const current = questions[qIdx];
  const completed = started && qIdx >= questions.length;

  const handleSelect = (opt, i) => {
    if (selected !== null) return;
    setSelected(i);
    if (opt.correct) {
      const nextScore = score + 1;
      setScore(nextScore);
      if (qIdx === questions.length - 1 && nextScore === questions.length) {
        setShowConfetti(true);
        setTimeout(() => setShowConfetti(false), 2500);
      }
    }
  };

  const nextQuestion = () => {
    if (qIdx === questions.length - 1) {
      setQIdx(questions.length);
    } else {
      setQIdx(qIdx + 1);
      setSelected(null);
    }
  };

  return (
    <div style={{ background: "#fff", borderRadius: 20, border: "1.5px solid #e7e7e7", padding: 22, marginBottom: 24, boxShadow: "0 8px 24px rgba(26,26,46,0.05)" }}>
      <Confetti show={showConfetti} />

      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 14, flexWrap: "wrap", marginBottom: 16 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
            <div style={{ width: 38, height: 38, borderRadius: 12, background: "linear-gradient(135deg, #009CDC, #F5822A)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 900, fontSize: 18 }}>?</div>
            <div>
              <h3 style={{ fontFamily: "Poppins, sans-serif", fontSize: 18, fontWeight: 800, color: "#1a1a2e", margin: 0 }}>Master Quiz</h3>
              <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 12, color: "#888", margin: "2px 0 0" }}>Random questions from the full vocabulary bank.</p>
            </div>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <select value={questionCount} onChange={e => setQuestionCount(Number(e.target.value))} disabled={started && !completed}
            style={{ padding: "9px 12px", borderRadius: 10, border: "1.5px solid #e0e0e0", fontFamily: "Poppins, sans-serif", fontSize: 13, fontWeight: 700, color: "#1a1a2e", background: "#fff" }}>
            {questionOptions.map(n => <option key={n} value={n}>{n} questions</option>)}
          </select>
          <button onClick={generateQuiz} style={{ ...pillBtn, background: "#1a1a2e", color: "#fff", padding: "9px 18px" }}>
            {started ? "New Random Quiz" : "Start Quiz"}
          </button>
        </div>
      </div>

      {!started && (
        <div style={{ background: "#f8f9fb", borderRadius: 14, padding: "16px 18px", border: "1.5px solid #eee" }}>
          <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 16, color: "#666", lineHeight: 1.6, margin: 0 }}>
            Choose any multiple of 5. The quiz will pull a fresh random set from all units each time.
          </p>
        </div>
      )}

      {started && current && !completed && (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
            <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, color: "#666", fontWeight: 600 }}>
              Question {qIdx + 1}/{questions.length} · Score: {score}
            </span>
            <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 10, fontWeight: 700, color: current.unitColor, background: `${current.unitColor}15`, padding: "4px 10px", borderRadius: 8 }}>
              Unit {current.unitId}
            </span>
          </div>

          <div style={{ height: 4, background: "#e8e8e8", borderRadius: 2, marginBottom: 18, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${(qIdx / questions.length) * 100}%`, background: current.unitColor, borderRadius: 2, transition: "width 0.4s" }} />
          </div>

          <div style={{ background: `linear-gradient(135deg, ${current.unitColor}12, ${current.unitColor}05)`, border: `2px solid ${current.unitColor}25`, borderRadius: 16, padding: "20px 18px", marginBottom: 16, textAlign: "center" }}>
            <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: current.unitColor, fontWeight: 800, fontFamily: "Poppins, sans-serif" }}>What is the definition of...</span>
            <p style={{ fontSize: 22, fontWeight: 800, color: "#1a1a2e", fontFamily: "Poppins, sans-serif", margin: "10px 0 0" }}>{current.term}</p>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
            {current.options.map((opt, i) => {
              let bg = "#fff", border = "#ddd", txtColor = "#333";
              if (selected !== null) {
                if (opt.correct) { bg = "#00B14015"; border = "#00B140"; txtColor = "#00B140"; }
                else if (i === selected && !opt.correct) { bg = "#E03C3115"; border = "#E03C31"; txtColor = "#E03C31"; }
              }
              return (
                <button key={i} onClick={() => handleSelect(opt, i)} style={{
                  ...matchCard, borderColor: border, background: bg, color: txtColor,
                  textAlign: "left", fontSize: 16, lineHeight: 1.5, padding: "14px 16px",
                  cursor: selected !== null ? "default" : "pointer"
                }}>
                  <span style={{ fontWeight: 800, marginRight: 10, color: border !== "#ddd" ? border : current.unitColor }}>
                    {String.fromCharCode(65 + i)}.
                  </span>
                  {opt.text}
                </button>
              );
            })}
          </div>

          {selected !== null && (
            <div style={{ textAlign: "center" }}>
              <button onClick={nextQuestion} style={{ ...pillBtn, background: current.unitColor, color: "#fff", padding: "10px 32px" }}>
                {qIdx === questions.length - 1 ? "See Results" : "Next →"}
              </button>
            </div>
          )}
        </>
      )}

      {completed && (
        <div style={{ textAlign: "center", padding: "20px 10px 10px" }}>
          <div style={{ fontSize: 44, marginBottom: 8 }}>{score / questions.length >= 0.8 ? "🏆" : "📚"}</div>
          <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 22, fontWeight: 800, color: "#1a1a2e", margin: 0 }}>
            Final Score: {score}/{questions.length}
          </p>
          <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 16, color: "#888", margin: "6px 0 18px" }}>
            {Math.round((score / questions.length) * 100)}% · Generate a new random quiz whenever you are ready.
          </p>
          <button onClick={generateQuiz} style={{ ...pillBtn, background: "#1a1a2e", color: "#fff", padding: "10px 32px" }}>Try Another Random Quiz</button>
        </div>
      )}
    </div>
  );
}

// Real links support crawlers, copying addresses, and opening study views in a new tab.
function StudyLink({ href, onClick, children, className = "", style, ...props }) {
  if (!href) return <button {...props} className={className} style={style} onClick={onClick}>{children}</button>;
  const follow = event => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (onClick) {
      event.preventDefault();
      onClick(event);
    }
  };
  return <a {...props} href={href} className={`study-link ${className}`} style={style} onClick={follow}>{children}</a>;
}

// Validate shared links before choosing a study view.
function readStudyRoute(search = window.location.search) {
  const params = new URLSearchParams(search);
  const value = params.get("unit");
  const unitId = value === "cumulative" ? value : UNITS.find(u => String(u.id) === value)?.id ?? null;
  const mode = params.get("mode");
  const moduleId = typeof unitId === "number" && MODULES.some(m => m.id === mode) ? mode : null;
  return { unitId, moduleId };
}

function studyUrl(unitId, moduleId, href = window.location.href) {
  const url = new URL(href);
  url.searchParams.delete("unit");
  url.searchParams.delete("mode");
  if (unitId !== null) url.searchParams.set("unit", unitId);
  if (moduleId !== null && typeof unitId === "number") url.searchParams.set("mode", moduleId);
  return url.pathname + url.search + url.hash;
}

                  display: "flex", alignItems: "center", gap: 10, width: "100%",

                        display: "flex", alignItems: "center", gap: 8, width: "100%",

                        background: selectedModule === m.id ? `${u.color}20` : "transparent",
                        color: selectedModule === m.id ? u.color : "#ffffff80",
                        cursor: "pointer", fontFamily: "Poppins, sans-serif", fontSize: 12,
                        fontWeight: selectedModule === m.id ? 600 : 400, transition: "all 0.15s",

          {/* Cumulative */}
          <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 2, color: "#ffffff40", fontWeight: 700, padding: "0 8px", marginBottom: 10 }}>Cumulative</div>

              display: "flex", alignItems: "center", gap: 10, width: "100%",

              background: selectedUnit === "cumulative" ? "#ffffff15" : "transparent",
              color: selectedUnit === "cumulative" ? "#FFD400" : "#ffffff80",
              cursor: "pointer", fontFamily: "Poppins, sans-serif", fontSize: 13,
              fontWeight: selectedUnit === "cumulative" ? 700 : 500, transition: "all 0.2s",
              textAlign: "left"

            <div style={{ width: 28, height: 28, borderRadius: 8, background: "linear-gradient(135deg, #009CDC, #F5822A)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, flexShrink: 0 }}>∑</div>

          </StudyLink>
        </div>

        <div style={{ padding: "12px 16px", borderTop: "1px solid #ffffff10", fontSize: 10, color: "#ffffff45", textAlign: "center", lineHeight: 1.5 }}>

        </div>
      </aside>

      <main id="study-content" tabIndex={-1} style={{ flex: 1, minWidth: 0 }}>
        {/* TOP BAR */}
        <header style={{ background: "#fff", borderBottom: "1.5px solid #eee", padding: "12px 20px", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, zIndex: 50 }}>

            background: "none", border: "none", cursor: "pointer", fontSize: 22, padding: "4px 6px",
            color: "#1a1a2e", display: "flex", alignItems: "center"
          }}>☰</button>

          {selectedUnit !== null && (
            <StudyLink href={studyUrl(null, null)} onClick={() => { navigate(null); }} style={{
              background: "none", border: "none", cursor: "pointer", fontSize: 18, padding: "4px 6px",
              color: "#888", display: "flex", alignItems: "center", fontFamily: "Poppins, sans-serif"
            }} title="Home">🏠</StudyLink>
          )}

          <div onClick={() => { navigate(null); }} title="Back to home" style={{ flex: 1, cursor: "pointer" }}>

              {selectedUnit === "cumulative" ? "Cumulative Review" : unit ? `Unit ${unit.id}: ${unit.title}` : "AP Business · Vocabulary Hub"}
            </div>
            {unit && selectedModule && (
              <div style={{ fontSize: 11, color: "#888", fontWeight: 500, fontFamily: "Poppins, sans-serif" }}>
                {MODULES.find(m => m.id === selectedModule)?.icon} {MODULES.find(m => m.id === selectedModule)?.label} · {unit.vocab.length} terms
              </div>
            )}
          </div>
        </header>

        <div style={{ padding: isMobile ? "20px 14px" : "28px 32px", maxWidth: 960, margin: "0 auto" }}>
          {/* HOME / LANDING */}
          {selectedUnit === null && (
            <div>
              {/* HERO */}
              <div style={{
                background: "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
                borderRadius: 24, padding: isMobile ? "24px 20px" : "32px 36px",
                marginBottom: 32, position: "relative", overflow: "hidden"
              }}>
                {/* Decorative circles */}
                <div style={{ position: "absolute", top: -40, right: -40, width: 180, height: 180, borderRadius: "50%", background: "#009CDC15", pointerEvents: "none" }} />
                <div style={{ position: "absolute", bottom: -30, left: -30, width: 120, height: 120, borderRadius: "50%", background: "#F5822A10", pointerEvents: "none" }} />
                <div style={{ position: "absolute", top: 20, right: 60, width: 50, height: 50, borderRadius: "50%", background: "#FFD40010", pointerEvents: "none" }} />

                <div style={{ position: "relative", zIndex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20 }}>
                    <VividIcon size={56} />
                    <div>
                      <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 11, fontWeight: 600, color: "#FFD400", textTransform: "uppercase", letterSpacing: 2 }}>
                        AP Business with Personal Finance
                      </div>
                    </div>
                  </div>

                  <h1 style={{
                    fontFamily: "Poppins, sans-serif", fontSize: isMobile ? 28 : 36, fontWeight: 900,
                    color: "#fff", margin: "0 0 8px", lineHeight: 1.15,
                    letterSpacing: "-0.5px"
                  }}>
                    AP Business with<br />Personal Finance
                  </h1>
                  <h2 style={{
                    fontFamily: "Poppins, sans-serif", fontSize: isMobile ? 18 : 20, fontWeight: 700,
                    color: "#009CDC", margin: "0 0 16px"
                  }}>
                    Vocabulary Mastery Hub
                  </h2>
                  <p style={{
                    fontFamily: "Poppins, sans-serif", fontSize: 15, color: "#ffffff90",
                    margin: "0 0 24px", maxWidth: 520, lineHeight: 1.6
                  }}>
                    Every key term from the official Course & Exam Description, organized by unit with five study modes designed to take you from first exposure to exam-ready confidence.
                  </p>

                  <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
                    <div style={{
                      display: "inline-flex", alignItems: "center", gap: 8,
                      background: "#ffffff12", borderRadius: 10, padding: "8px 16px",
                      border: "1px solid #ffffff15"
                    }}>
                      <span style={{ fontSize: 18 }}>👨‍🏫</span>
                      <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, fontWeight: 600, color: "#fff" }}>Source: Official Course & Exam Description</span>
                    </div>
                    <div style={{
                      display: "inline-flex", alignItems: "center", gap: 8,
                      background: "#ffffff12", borderRadius: 10, padding: "8px 16px",
                      border: "1px solid #ffffff15"
                    }}>
                      <span style={{ fontSize: 18 }}>📚</span>
                      <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, fontWeight: 600, color: "#fff" }}>
                        {UNITS.reduce((a, u) => a + u.vocab.length, 0)} Total Terms
                      </span>
                    </div>
                    <div style={{
                      display: "inline-flex", alignItems: "center", gap: 8,
                      background: "#ffffff12", borderRadius: 10, padding: "8px 16px",
                      border: "1px solid #ffffff15"
                    }}>
                      <span style={{ fontSize: 18 }}>🎯</span>
                      <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, fontWeight: 600, color: "#fff" }}>{UNITS.length} Units</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* HOW IT WORKS — Learning Progression */}
              <div style={{ marginBottom: 36 }}>
                <h3 style={{ fontFamily: "Poppins, sans-serif", fontSize: 18, fontWeight: 800, color: "#1a1a2e", margin: "0 0 6px" }}>
                  How It Works
                </h3>
                <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, color: "#888", margin: "0 0 16px" }}>
                  Each unit follows a proven learning progression — understand first, then practice, then test.
                </p>
                <div style={{ display: "flex", gap: isMobile ? 8 : 12, flexWrap: "wrap" }}>
                  {MODULES.map((m, i) => (
                    <div key={m.id} style={{
                      flex: isMobile ? "1 1 calc(50% - 8px)" : 1,
                      background: "#fff", borderRadius: 14, padding: isMobile ? "14px 12px" : "16px",
                      border: "1.5px solid #eee", textAlign: "center",
                      position: "relative"
                    }}>
                      <div style={{
                        position: "absolute", top: -10, left: "50%", transform: "translateX(-50%)",
                        background: "#1a1a2e", color: "#fff", fontSize: 10, fontWeight: 700,
                        padding: "2px 10px", borderRadius: 6, fontFamily: "Poppins, sans-serif",
                        letterSpacing: 0.5
                      }}>
                        Step {i + 1}
                      </div>
                      <div style={{ fontSize: 28, marginBottom: 6, marginTop: 6 }}>{m.icon}</div>
                      <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, fontWeight: 700, color: "#1a1a2e", marginBottom: 2 }}>{m.label}</div>
                      <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 11, color: "#009CDC", fontWeight: 600 }}>{m.step}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* UNITS SECTION */}
              <div style={{ marginBottom: 32 }}>
                <h3 style={{ fontFamily: "Poppins, sans-serif", fontSize: 18, fontWeight: 800, color: "#1a1a2e", margin: "0 0 6px" }}>
                  Course Units
                </h3>
                <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, color: "#888", margin: "0 0 16px" }}>
                  Select a unit to begin studying. All sections are unlocked — study in any order.
                </p>

                <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                  {UNITS.map(u => (
                    <StudyLink href={studyUrl(u.id, null)} key={u.id} onClick={() => navigate(u.id)} style={{
                      background: "#fff", borderRadius: 20, border: "1.5px solid #eee",
                      padding: isMobile ? 18 : 24, cursor: "pointer", textAlign: "left",
                      transition: "all 0.2s", display: "flex", flexDirection: "column", gap: 14,
                      width: "100%"
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 14, width: "100%" }}>
                        <div style={{
                          width: 52, height: 52, borderRadius: 14, background: u.color,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          fontSize: 20, fontWeight: 900, color: "#fff", flexShrink: 0,
                          boxShadow: `0 4px 14px ${u.color}40`
                        }}>{u.id}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 17, fontWeight: 700, color: "#1a1a2e" }}>{u.title}</div>
                          <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 12, color: "#888", marginTop: 2 }}>
                            {u.vocab.length} terms
                          </div>
                        </div>
                      </div>

                      {/* Sample terms preview */}
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {u.vocab.slice(0, isMobile ? 4 : 7).map(v => (
                          <span key={v.term} style={{
                            fontSize: 11, fontWeight: 500, color: "#666",
                            background: "#f5f6fa", padding: "3px 10px", borderRadius: 6,
                            fontFamily: "Poppins, sans-serif", whiteSpace: "nowrap"
                          }}>
                            {v.term}
                          </span>
                        ))}
                        <span style={{ fontSize: 11, fontWeight: 600, color: u.color, padding: "3px 6px", fontFamily: "Poppins, sans-serif" }}>
                          +{Math.max(0, u.vocab.length - (isMobile ? 4 : 7))} more
                        </span>
                      </div>

                      {/* Module tags */}
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", borderTop: "1px solid #f0f0f0", paddingTop: 12 }}>
                        {MODULES.map(m => (
                          <span key={m.id} style={{
                            fontSize: 10, fontWeight: 600, color: u.color,
                            background: `${u.color}10`, padding: "3px 10px", borderRadius: 6,
                            fontFamily: "Poppins, sans-serif"
                          }}>
                            {m.icon} {m.label}
                          </span>
                        ))}
                      </div>
                    </StudyLink>
                  ))}
                </div>
              </div>

              {/* CUMULATIVE REVIEW CARD */}
              <StudyLink href={studyUrl("cumulative", null)} onClick={() => navigate("cumulative")} style={{
                width: "100%", background: "linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)",
                borderRadius: 20, border: "none", padding: isMobile ? "24px 20px" : "28px 32px",
                cursor: "pointer", textAlign: "left", color: "#fff", marginBottom: 32,
                position: "relative", overflow: "hidden"
              }}>
                <div style={{ position: "absolute", top: -20, right: -20, width: 100, height: 100, borderRadius: "50%", background: "#FFD40010", pointerEvents: "none" }} />
                <div style={{ display: "flex", alignItems: "center", gap: 16, position: "relative", zIndex: 1 }}>
                  <div style={{
                    width: 52, height: 52, borderRadius: 14,
                    background: "linear-gradient(135deg, #009CDC, #F5822A)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 24, flexShrink: 0
                  }}>∑</div>
                  <div>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 18, fontWeight: 700 }}>Cumulative Vocabulary Review</div>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, color: "#ffffff70", marginTop: 4 }}>
                      All {UNITS.reduce((a, u) => a + u.vocab.length, 0)} terms across {UNITS.length} units · Searchable & color-coded
                    </div>
                  </div>
                </div>
              </StudyLink>

              {/* COURSE INFO FOOTER */}
              <div style={{
                background: "#fff", borderRadius: 16, border: "1.5px solid #eee",
                padding: isMobile ? 18 : 24, marginBottom: 16
              }}>
                <h4 style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, fontWeight: 700, color: "#1a1a2e", margin: "0 0 12px" }}>
                  About This Course
                </h4>
                <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr 1fr", gap: 14 }}>
                  <div style={{ background: "#f8f9fb", borderRadius: 12, padding: "14px 16px" }}>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 11, color: "#888", fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Course</div>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, fontWeight: 700, color: "#1a1a2e" }}>AP Business with Personal Finance</div>
                  </div>
                  <div style={{ background: "#f8f9fb", borderRadius: 12, padding: "14px 16px" }}>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 11, color: "#888", fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Exam Date</div>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, fontWeight: 700, color: "#1a1a2e" }}>Spring 2027 (first administration)</div>
                  </div>
                  <div style={{ background: "#f8f9fb", borderRadius: 12, padding: "14px 16px" }}>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 11, color: "#888", fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Source</div>
                    <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 14, fontWeight: 700, color: "#1a1a2e" }}> AP Course and Exam Description.</div>
                  </div>
                </div>
              </div>

              <div style={{ textAlign: "center", padding: "14px 0 22px", fontFamily: "Poppins, sans-serif", fontSize: 11, color: "#999", lineHeight: 1.6 }}>
                Not affiliated with or endorsed by College Board or the AP Program. Not affiliated with or endorsed by the AP Program. Made for instructional purposes only.
                <br />Issues, corrections, or suggestions? Email: <span style={{ color: "#009CDC", fontWeight: 600 }}>[apbusinessvocab@vividlessons.com - Mr. DiPasquale]</span>
              </div>
            </div>
          )}

          {/* UNIT SELECTED BUT NO MODULE */}
          {selectedUnit !== null && selectedUnit !== "cumulative" && selectedModule === null && unit && (
            <div>
              <div style={{
                background: `linear-gradient(135deg, ${unitColor}14, ${unitColor}06)`,
                borderRadius: 20, padding: isMobile ? 20 : 32, marginBottom: 28,
                border: `2px solid ${unitColor}20`, position: "relative", overflow: "hidden"
              }}>
                <div style={{ position: "absolute", top: -30, right: -30, width: 120, height: 120, borderRadius: "50%", background: `${unitColor}10`, pointerEvents: "none" }} />
                <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 8, position: "relative", zIndex: 1 }}>
                  <div style={{ width: 52, height: 52, borderRadius: 14, background: unitColor, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 900, color: "#fff", boxShadow: `0 4px 14px ${unitColor}40` }}>{unit.id}</div>
                  <div>
                    <h2 style={{ fontFamily: "Poppins, sans-serif", fontSize: isMobile ? 20 : 24, fontWeight: 800, color: "#1a1a2e", margin: 0 }}>{unit.title}</h2>
                    <span style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, color: "#888" }}>
                      {unit.summary}
                    </span>
                  </div>
                </div>
              </div>

              <p style={{ fontFamily: "Poppins, sans-serif", fontSize: 13, color: "#888", margin: "0 0 16px", fontWeight: 500 }}>
                Follow the progression below — or jump to any module.
              </p>

              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {MODULES.map((m, i) => (
                  <StudyLink href={studyUrl(selectedUnit, m.id)} key={m.id} onClick={() => navigate(selectedUnit, m.id)} style={{
                    background: "#fff", borderRadius: 16, border: "1.5px solid #eee",
                    padding: isMobile ? "16px 14px" : "18px 20px", cursor: "pointer", textAlign: "left",
                    transition: "all 0.2s", display: "flex", alignItems: "center", gap: 14,
                    width: "100%"
                  }}>
                    <div style={{
                      width: 44, height: 44, borderRadius: 12,
                      background: `${unitColor}12`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 22, flexShrink: 0, position: "relative"
                    }}>
                      {m.icon}
                      <div style={{
                        position: "absolute", top: -6, left: -6,
                        width: 20, height: 20, borderRadius: "50%",
                        background: unitColor, color: "#fff",
                        fontSize: 10, fontWeight: 800, display: "flex",
                        alignItems: "center", justifyContent: "center",
                        fontFamily: "Poppins, sans-serif"
                      }}>{i + 1}</div>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{m.label}</div>
                      <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 12, color: "#888", marginTop: 2 }}>
                        {m.desc}
                      </div>
                    </div>
                    <div style={{
                      fontFamily: "Poppins, sans-serif", fontSize: 10, fontWeight: 700,
                      color: unitColor, background: `${unitColor}12`,
                      padding: "3px 10px", borderRadius: 6,
                      textTransform: "uppercase", letterSpacing: 0.5
                    }}>
                      {m.step}
                    </div>
                  </StudyLink>
                ))}
              </div>
            </div>
          )}

          {/* MODULE VIEW */}
          {selectedUnit !== null && selectedUnit !== "cumulative" && selectedModule !== null && unit && (() => {
            const Comp = MODULES.find(m => m.id === selectedModule)?.comp;
            return Comp ? (
              <div>
                <Comp key={`${unit.id}-${selectedModule}-${practiceRun}`} vocab={unit.vocab} unitColor={unitColor} />
                <ModuleBottomNav currentUnitId={selectedUnit} currentModuleId={selectedModule} unitColor={unitColor} onNavigate={moduleId => navigate(selectedUnit, moduleId)} />
              </div>
            ) : null;
          })()}

          {/* CUMULATIVE */}
          {selectedUnit === "cumulative" && (
            <CumulativeReview units={UNITS} activeUnitIds={UNITS.map(u => u.id)} />
          )}
          {(unit || selectedUnit === "cumulative") && (
            <KeepPracticing unit={unit} onPractice={startPractice} />
          )}
        </div>
      </main>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
